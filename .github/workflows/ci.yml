# Lint + typecheck + tests + docs-in-sync on every push and PR.
#
# `workflow_call` lets docker-publish.yml run this exact job instead of keeping a
# second copy of it in sync by hand — the image only builds when this passes.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # tsc and eslint both need the generated Next route types
      # (PageProps/RouteContext), which only exist after a build or typegen.
      - name: Generate Next types
        run: npx next typegen

      # eslint.config.mjs pins the handful of files with pre-existing react-hooks
      # findings down to warnings, so this fails on any NEW violation — including a
      # react-hooks one in a file that isn't already on that list.
      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: yarn test

      # AGENTS.md: "a route change with stale docs is an incomplete change".
      # The catalog is generated from app/api/**/route.ts, so regenerating it must
      # be a no-op — a diff here means a route was added or changed without
      # running `node scripts/gen-api-catalog.mjs`.
      - name: API docs in sync
        run: |
          node scripts/gen-api-catalog.mjs
          if ! git diff --quiet -- docs/api/catalog.json; then
            echo "::error file=docs/api/catalog.json::API catalog is stale. Run 'node scripts/gen-api-catalog.mjs' and update the matching page under docs/api/."
            git --no-pager diff -- docs/api/catalog.json
            exit 1
          fi
